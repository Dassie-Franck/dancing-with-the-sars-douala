name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**", "chore/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend: ${{ steps.f.outputs.backend }}
      data: ${{ steps.f.outputs.data }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            data:
              - 'data-processing/**'

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          pip install ruff pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - run: ruff check backend
      - name: Vérifier que le module s'importe
        run: python -m py_compile backend/main.py
      - run: pytest backend || [ $? -eq 5 ]   # 5 = aucun test (toléré)

  data-processing:
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          pip install ruff
          if [ -f data-processing/requirements.txt ]; then pip install -r data-processing/requirements.txt; fi
      - run: ruff check data-processing/scripts
      - name: Générer des données factices
        run: python data-processing/scripts/make_mock_data.py
      - name: Valider le contrat de données
        run: python data-processing/scripts/validate_contract.py

  ci-gate:
    name: CI Gate
    if: always()
    needs: [secrets-scan, frontend, backend, data-processing]
    runs-on: ubuntu-latest
    steps:
      - name: Tout est vert (ou ignoré) ?
        run: |
          echo '${{ join(needs.*.result, ' ') }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then
            echo "❌ Au moins un job a échoué"; exit 1
          fi
          echo "✅ Tout est vert"